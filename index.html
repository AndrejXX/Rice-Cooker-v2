<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05070a" />
  <title>Rice cooker</title>
  <style>
    :root {
      --bg: #05070a;
      --card-bg: rgba(10, 17, 22, 0.94);
      --cyan: #22d3ee;
      --cyan-dim: rgba(34, 211, 238, 0.12);
      --mint: #10b981;
      --mint-bright: #34d399;
      --mint-glow: rgba(16, 185, 129, 0.35);
      --mint-dim: rgba(16, 185, 129, 0.15);
      --text: #ffffff;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }

    body {
      padding: calc(14px + env(safe-area-inset-top)) 15px calc(20px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Zaglavlje */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 2px 4px;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .cooker-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--mint-bright);
      filter: drop-shadow(0 0 8px var(--mint-glow));
    }

    /* Koso rezani HUD okvir (Chamfered) */
    .chamfer {
      position: relative;
      padding: 1.5px;
      background: linear-gradient(135deg, var(--cyan) 0%, var(--mint) 100%);
      clip-path: polygon(9px 0, calc(100% - 9px) 0, 100% 9px, 100% calc(100% - 9px), calc(100% - 9px) 100%, 9px 100%, 0 calc(100% - 9px), 0 9px);
    }

    .chamfer-inner {
      background: #060b10;
      clip-path: polygon(8.5px 0, calc(100% - 8.5px) 0, 100% 8.5px, 100% calc(100% - 8.5px), calc(100% - 8.5px) 100%, 8.5px 100%, 0 calc(100% - 8.5px), 0 8.5px);
    }

    .chamfer.mint {
      background: linear-gradient(135deg, var(--mint-bright) 0%, #047857 100%);
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.22);
    }

    .chamfer.mint .chamfer-inner {
      background: linear-gradient(90deg, #051a14 0%, #030f0b 100%);
    }

    .tara-badge {
      padding: 6px 14px;
      font-size: 13.5px;
      font-weight: 700;
      color: #e2f8ff;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
    }

    /* Gornja HUD kartica */
    .hud-card {
      background: linear-gradient(180deg, rgba(14, 25, 30, 0.94) 0%, rgba(8, 12, 16, 0.97) 100%);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 18px;
      padding: 15px;
      box-shadow: 0 0 24px rgba(16, 185, 129, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .top-grid {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Dvobojni HUD brojčanik */
    .dial-wrap {
      position: relative;
      width: 104px;
      height: 104px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
    }

    .dial-wrap svg {
      position: absolute;
      inset: 0;
    }

    .dial-center {
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .dial-center strong {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
    }

    .dial-center span {
      font-size: 13px;
      color: #cbd5e1;
      margin-left: 2px;
    }

    /* Desna strana unosa */
    .controls-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-label {
      font-size: 13px;
      color: #cbd5e1;
      font-weight: 500;
    }

    .gram-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .gram-box {
      display: flex;
      align-items: baseline;
      gap: 3px;
    }

    .gram-input {
      width: 78px;
      background: transparent;
      border: none;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.22);
      color: #ffffff;
      font-size: 32px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      outline: none;
      padding: 0;
    }

    .gram-input:focus {
      border-bottom-color: var(--cyan);
    }

    .gram-unit {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
    }

    .pm-group {
      display: flex;
      gap: 7px;
    }

    .pm-btn {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: rgba(8, 15, 18, 0.95);
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.1s ease;
    }

    .pm-btn.plus {
      border: 1.5px solid var(--mint-bright);
      color: var(--mint-bright);
      box-shadow: 0 0 10px var(--mint-dim);
    }

    .pm-btn.minus {
      border: 1.5px solid var(--cyan);
      color: var(--cyan);
      box-shadow: 0 0 10px var(--cyan-dim);
    }

    .pm-btn:active {
      transform: scale(0.92);
    }

    /* Tekstura */
    .texture-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 5px 4px;
      border-radius: 999px;
      background: rgba(6, 10, 13, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }

    .tex-btn {
      border: none;
      background: transparent;
      color: #cbd5e1;
      font-size: 12.5px;
      font-weight: 600;
      padding: 4px 2px;
      border-radius: 999px;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .tex-btn.active {
      color: var(--mint-bright);
      font-weight: 700;
      text-shadow: 0 0 10px rgba(16, 185, 129, 0.45);
    }

    /* Ručni unos omjera */
    .ratio-row {
      margin-top: 13px;
      padding-top: 11px;
      border-top: 1px solid rgba(148, 163, 184, 0.14);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .ratio-label {
      font-size: 15px;
      color: var(--mint-bright);
      font-weight: 600;
    }

    .ratio-box {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 9px;
      background: rgba(6, 12, 15, 0.95);
      border: 1.5px solid var(--mint);
      box-shadow: 0 0 12px var(--mint-dim);
    }

    .ratio-prefix {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
    }

    .ratio-input {
      width: 48px;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-align: center;
      outline: none;
    }

    /* Opcije (+20% vode i oprana riža) */
    .options-list {
      margin-top: 11px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }

    .opt-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mint-check {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 1.5px solid var(--mint);
      background: rgba(6, 10, 13, 0.95);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: 0.15s ease;
    }

    .mint-check svg {
      opacity: 0;
      transform: scale(0.7);
      transition: 0.15s ease;
    }

    input[type="checkbox"]:checked + .mint-check {
      background: rgba(16, 185, 129, 0.2);
      box-shadow: 0 0 10px var(--mint-dim);
    }

    input[type="checkbox"]:checked + .mint-check svg {
      opacity: 1;
      transform: scale(1);
    }

    .opt-text {
      font-size: 14px;
      color: #e2e8f0;
      font-weight: 500;
    }

    .opt-muted {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* Switch za opranu rižu */
    .hud-switch {
      position: relative;
      width: 42px;
      height: 22px;
      border-radius: 999px;
      background: rgba(5, 8, 12, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.3);
      flex-shrink: 0;
      transition: 0.2s ease;
    }

    .hud-switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #94a3b8;
      transition: 0.2s ease;
    }

    input[type="checkbox"]:checked + .hud-switch {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--cyan);
      box-shadow: 0 0 10px var(--cyan-dim);
    }

    input[type="checkbox"]:checked + .hud-switch::after {
      transform: translateX(20px);
      background: var(--cyan);
    }

    /* Središnji 3D Wireframe HUD */
    .radar-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -2px;
    }

    .radar-svg {
      width: 100%;
      max-width: 340px;
      height: auto;
    }

    .total-title {
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      margin-top: -6px;
      text-align: center;
    }

    .pills-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    .pill-content {
      padding: 8px 10px;
      text-align: center;
      font-size: 13.5px;
      font-weight: 700;
      color: #f1f5f9;
      font-variant-numeric: tabular-nums;
    }

    /* 3 koraka vaganja */
    .steps-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .step-inner {
      padding: 10px 14px;
      font-size: 15.5px;
      font-weight: 600;
      color: #f8fafc;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chamfer.mint .step-inner {
      color: var(--mint-bright);
    }

    .step-tag {
      width: 18px;
      height: 4px;
      background: var(--cyan);
      clip-path: polygon(4px 0, 100% 0, 100% 100%, 0 100%);
      opacity: 0.75;
    }

    .chamfer.mint .step-tag {
      background: var(--mint-bright);
    }
  </style>
</head>
<body>
  <main class="app">
    <!-- Zaglavlje -->
    <header>
      <div class="title-wrap">
        <h1>Rice cooker</h1>
        <div class="cooker-icon" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 6.5h6v2h-6z" />
            <path d="M6 12.5c0-3 3.5-4.5 8-4.5s8 1.5 8 4.5" />
            <path d="M4.5 12.5h19" />
            <path d="M6.5 12.5h15v8a3 3 0 0 1-3 3h-9a3 3 0 0 1-3-3v-8z" />
            <path d="M4.5 15.5h2M21.5 15.5h2" />
            <rect x="11.5" y="15.5" width="5" height="4.5" rx="1" />
          </svg>
        </div>
      </div>

      <div class="chamfer">
        <div class="chamfer-inner tara-badge">Tara: 130 g</div>
      </div>
    </header>

    <!-- Gornja HUD kartica -->
    <section class="hud-card">
      <div class="top-grid">
        <!-- Dvobojni kružni HUD mjerač -->
        <div class="dial-wrap">
          <svg width="104" height="104" viewBox="0 0 104 104">
            <circle cx="52" cy="52" r="46" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1.5" />
            <circle cx="52" cy="52" r="36" fill="none" stroke="rgba(148,163,184,0.22)" stroke-width="4" stroke-dasharray="1.5 3.5" />
            <!-- Cijan gornji lijevi luk -->
            <path d="M 16 64 A 38 38 0 0 1 68 17" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
            <!-- Mint donji desni luk -->
            <path d="M 74 21 A 38 38 0 0 1 26 80" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
          </svg>
          <div class="dial-center">
            <strong id="dialGrams">200</strong><span>g</span>
          </div>
        </div>

        <!-- Kontrole gramaže i teksture -->
        <div class="controls-col">
          <div class="field-label">Suha riža</div>
          <div class="gram-row">
            <div class="gram-box">
              <input type="number" id="riceInput" class="gram-input" value="200" min="10" max="2000" step="10" inputmode="numeric" />
              <span class="gram-unit">g</span>
            </div>
            <div class="pm-group">
              <button type="button" class="pm-btn plus" id="plusBtn" aria-label="Povećaj rižu">+</button>
              <button type="button" class="pm-btn minus" id="minusBtn" aria-label="Smanji rižu">−</button>
            </div>
          </div>

          <div class="texture-bar">
            <button type="button" class="tex-btn" data-ratio="1.35">Čvršća</button>
            <button type="button" class="tex-btn active" data-ratio="1.50">Standardna</button>
            <button type="button" class="tex-btn" data-ratio="1.65">Mekša</button>
          </div>
        </div>
      </div>

      <!-- Ručni unos omjera -->
      <div class="ratio-row">
        <label for="ratioInput" class="ratio-label">Omjer (riža : voda)</label>
        <div class="ratio-box">
          <span class="ratio-prefix">1 :</span>
          <input type="text" id="ratioInput" class="ratio-input" value="1.50" inputmode="decimal" />
        </div>
      </div>

      <!-- Opcije -->
      <div class="options-list">
        <label class="opt-row">
          <span class="opt-left">
            <input type="checkbox" id="boostCheck" hidden />
            <span class="mint-check">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </span>
            <span class="opt-text">
              Povećaj vodu 20% <span class="opt-muted" id="boostPreview">(300 g → 360 g)</span>
            </span>
          </span>
        </label>

        <label class="opt-row">
          <span class="opt-text">
            Oprana riža <span class="opt-muted" id="rinseHint">(−30 g vode)</span>
          </span>
          <input type="checkbox" id="rinseSwitch" hidden />
          <span class="hud-switch" aria-hidden="true"></span>
        </label>
      </div>
    </section>

    <!-- Središnji izometrijski 3D wireframe HUD -->
    <section class="radar-stage">
      <svg class="radar-svg" viewBox="0 0 340 205">
        <defs>
          <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
            <stop offset="100%" stop-color="#05070a" stop-opacity="0" />
          </radialGradient>
        </defs>

        <circle cx="170" cy="102" r="96" fill="url(#radarGlow)" />

        <!-- Dekorativni HUD mikro-blokovi lijevo i desno -->
        <g fill="rgba(148, 163, 184, 0.1)">
          <rect x="14" y="34" width="38" height="2" />
          <rect x="14" y="39" width="26" height="2" />
          <rect x="14" y="44" width="32" height="2" />
          <rect x="14" y="148" width="34" height="2" />
          <rect x="14" y="153" width="22" height="2" />
          <rect x="288" y="34" width="38" height="2" />
          <rect x="300" y="39" width="26" height="2" />
          <rect x="292" y="148" width="34" height="2" />
          <rect x="304" y="153" width="22" height="2" />
        </g>

        <!-- Vanjski radarski prsteni i crtice -->
        <circle cx="170" cy="102" r="90" fill="none" stroke="rgba(148,163,184,0.18)" stroke-width="1" />
        <circle cx="170" cy="102" r="82" fill="none" stroke="rgba(148,163,184,0.35)" stroke-width="5" stroke-dasharray="1.4 4.2" />
        <circle cx="170" cy="102" r="68" fill="none" stroke="rgba(56,189,248,0.16)" stroke-width="1" stroke-dasharray="28 14" />

        <!-- Križne oznake kompasa -->
        <line x1="170" y1="6" x2="170" y2="16" stroke="rgba(148, 163, 184, 0.5)" stroke-width="1.4" />
        <line x1="170" y1="188" x2="170" y2="198" stroke="rgba(148, 163, 184, 0.5)" stroke-width="1.4" />
        <line x1="72" y1="102" x2="82" y2="102" stroke="rgba(148, 163, 184, 0.5)" stroke-width="1.4" />
        <line x1="258" y1="102" x2="268" y2="102" stroke="rgba(148, 163, 184, 0.5)" stroke-width="1.4" />

        <!-- Izometrijska baza digitalne vage -->
        <g stroke="rgba(148, 163, 184, 0.5)" stroke-width="1.2" fill="rgba(10, 17, 24, 0.88)">
          <polygon points="108,118 192,96 244,128 158,154" />
          <polygon points="108,118 158,154 158,161 108,124" fill="#040608" />
          <polygon points="158,154 244,128 244,135 158,161" fill="#0a1219" />
          <!-- Gumbi i LCD na prednjem rubu vage -->
          <ellipse cx="122" cy="124" rx="4.5" ry="2.8" fill="none" stroke="rgba(203, 213, 225, 0.5)" />
          <ellipse cx="131" cy="130" rx="4.5" ry="2.8" fill="none" stroke="rgba(203, 213, 225, 0.5)" />
          <polygon points="138,132 152,141 146,145 132,136" fill="#04080c" stroke="#38bdf8" />
          <ellipse cx="157" cy="146" rx="4" ry="2.5" fill="none" stroke="rgba(203, 213, 225, 0.5)" />
        </g>

        <!-- Izometrijska žičana posuda kuhala -->
        <g>
          <!-- Stražnji dio posude -->
          <path d="M126 52 L126 98 A 44 17 0 0 0 214 98 L214 52" fill="rgba(12, 19, 25, 0.78)" stroke="#cbd5e1" stroke-width="1.3" />

          <!-- Razine riže i vode unutar posude -->
          <ellipse id="potRiceTop" cx="170" cy="88" rx="42" ry="15" fill="rgba(226, 232, 240, 0.22)" stroke="rgba(226, 232, 240, 0.45)" stroke-width="0.9" />
          <ellipse id="potWaterTop" cx="170" cy="74" rx="42.5" ry="15.5" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="1.1" />

          <!-- Unutarnja wireframe mreža i mjerna skala -->
          <path d="M136 66 A 40 14 0 0 0 204 66" fill="none" stroke="rgba(148,163,184,0.2)" stroke-width="0.8" />
          <path d="M132 82 A 42 15 0 0 0 208 82" fill="none" stroke="rgba(148,163,184,0.2)" stroke-width="0.8" />
          <line x1="152" y1="68" x2="152" y2="112" stroke="rgba(148,163,184,0.2)" stroke-width="0.8" />
          <line x1="170" y1="69" x2="170" y2="115" stroke="rgba(148,163,184,0.2)" stroke-width="0.8" />
          <line x1="188" y1="68" x2="188" y2="112" stroke="rgba(148,163,184,0.2)" stroke-width="0.8" />

          <!-- Mjerne crtice na desnom zidu -->
          <g stroke="rgba(203, 213, 225, 0.6)" stroke-width="0.9">
            <line x1="196" y1="68" x2="203" y2="66" />
            <line x1="196" y1="74" x2="201" y2="73" />
            <line x1="196" y1="80" x2="203" y2="78" />
            <line x1="196" y1="86" x2="201" y2="85" />
            <line x1="196" y1="92" x2="203" y2="90" />
          </g>

          <!-- Gornji dvostruki rub posude -->
          <ellipse cx="170" cy="52" rx="45" ry="17" fill="none" stroke="#cbd5e1" stroke-width="1.4" />
          <ellipse cx="170" cy="52" rx="41" ry="14.5" fill="none" stroke="#94a3b8" stroke-width="0.9" />
        </g>
      </svg>

      <div class="total-title" id="totalReadout">Ukupno: 630 g</div>

      <div class="pills-grid">
        <div class="chamfer">
          <div class="chamfer-inner pill-content" id="ricePill">Riža: 200 g</div>
        </div>
        <div class="chamfer">
          <div class="chamfer-inner pill-content" id="waterPill">Voda: 300 g</div>
        </div>
      </div>
    </section>

    <!-- 3 koraka vaganja -->
    <section class="steps-stack">
      <div class="chamfer">
        <div class="chamfer-inner step-inner">
          <span>1. Prazna posuda: <strong>130 g</strong></span>
          <span class="step-tag"></span>
        </div>
      </div>

      <div class="chamfer">
        <div class="chamfer-inner step-inner">
          <span>2. Dodaj rižu do <strong id="stepRice">330 g</strong></span>
          <span class="step-tag"></span>
        </div>
      </div>

      <div class="chamfer mint">
        <div class="chamfer-inner step-inner">
          <span>3. Dodaj vodu do <strong id="stepTotal">630 g</strong></span>
          <span class="step-tag"></span>
        </div>
      </div>
    </section>
  </main>

  <script>
    const TARE = 130;
    const riceInput = document.getElementById("riceInput");
    const ratioInput = document.getElementById("ratioInput");
    const boostCheck = document.getElementById("boostCheck");
    const rinseSwitch = document.getElementById("rinseSwitch");
    const texButtons = document.querySelectorAll(".tex-btn");

    try {
      const saved = JSON.parse(localStorage.getItem("rc_mint_prefs") || "{}");
      if (saved.rice) riceInput.value = saved.rice;
      if (saved.ratio) ratioInput.value = Number(saved.ratio).toFixed(2);
      if (typeof saved.boost === "boolean") boostCheck.checked = saved.boost;
      if (typeof saved.rinsed === "boolean") rinseSwitch.checked = saved.rinsed;
    } catch (_) {}

    function parseRatio() {
      const raw = String(ratioInput.value).replace(",", ".").trim();
      const val = parseFloat(raw);
      return (!isNaN(val) && val > 0 && val <= 10) ? val : 1.50;
    }

    function syncTextureHighlight(ratio) {
      texButtons.forEach(btn => {
        const preset = parseFloat(btn.dataset.ratio);
        btn.classList.toggle("active", Math.abs(preset - ratio) < 0.005);
      });
    }

    function calculate() {
      let rice = parseInt(riceInput.value, 10);
      if (isNaN(rice) || rice < 1) rice = 10;
      if (rice > 2000) rice = 2000;

      const ratio = parseRatio();
      syncTextureHighlight(ratio);

      const baseWater = Math.round(rice * ratio);
      const boostedWater = Math.round(baseWater * 1.20);
      const isBoosted = boostCheck.checked;
      const isRinsed = rinseSwitch.checked;

      const rinseDeduction = Math.round(rice * 0.15);
      const targetWater = isBoosted ? boostedWater : baseWater;
      const water = Math.max(10, isRinsed ? (targetWater - rinseDeduction) : targetWater);

      const afterRice = TARE + rice;
      const total = afterRice + water;

      document.getElementById("dialGrams").textContent = rice;
      document.getElementById("boostPreview").textContent = `(${baseWater} g → ${boostedWater} g)`;
      document.getElementById("rinseHint").textContent = `(−${rinseDeduction} g vode)`;
      document.getElementById("totalReadout").textContent = `Ukupno: ${total} g`;
      document.getElementById("ricePill").textContent = `Riža: ${rice} g`;

      const tags = [];
      if (isBoosted) tags.push("+20%");
      if (isRinsed) tags.push(`−${rinseDeduction} g`);
      document.getElementById("waterPill").textContent =
        tags.length > 0 ? `Voda: ${water} g (${tags.join(", ")})` : `Voda: ${water} g`;

      document.getElementById("stepRice").textContent = `${afterRice} g`;
      document.getElementById("stepTotal").textContent = `${total} g`;

      // Dinamičke razine u izometrijskoj posudi
      const fill = Math.min(1, Math.max(0.2, rice / 500));
      const riceCy = Math.round(96 - fill * 12);
      const waterCy = Math.max(62, Math.round(riceCy - 10 - (ratio - 1.2) * 8 - (isBoosted ? 3 : 0) + (isRinsed ? 2 : 0)));
      document.getElementById("potRiceTop").setAttribute("cy", riceCy);
      document.getElementById("potWaterTop").setAttribute("cy", waterCy);

      try {
        localStorage.setItem("rc_mint_prefs", JSON.stringify({
          rice,
          ratio,
          boost: isBoosted,
          rinsed: isRinsed
        }));
      } catch (_) {}
    }

    document.getElementById("plusBtn").addEventListener("click", () => {
      const current = parseInt(riceInput.value, 10) || 200;
      riceInput.value = Math.min(2000, current + 10);
      calculate();
    });

    document.getElementById("minusBtn").addEventListener("click", () => {
      const current = parseInt(riceInput.value, 10) || 200;
      riceInput.value = Math.max(10, current - 10);
      calculate();
    });

    riceInput.addEventListener("input", calculate);
    ratioInput.addEventListener("input", calculate);
    ratioInput.addEventListener("blur", () => {
      ratioInput.value = parseRatio().toFixed(2);
      calculate();
    });
    boostCheck.addEventListener("change", calculate);
    rinseSwitch.addEventListener("change", calculate);

    texButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        ratioInput.value = parseFloat(btn.dataset.ratio).toFixed(2);
        calculate();
      });
    });

    calculate();
  </script>
</body>
</html>
