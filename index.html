<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Rice cooker</title>
  <style>
    :root {
      --bg: #000000;
      --glass-border: rgba(56, 189, 248, 0.25);
      --cyan: #22d3ee;
      --cyan-glow: rgba(34, 211, 238, 0.35);
      --cyan-dim: rgba(34, 211, 238, 0.12);
      --ember: #f97316;
      --ember-glow: rgba(249, 115, 22, 0.35);
      --ember-dim: rgba(249, 115, 22, 0.14);
      --text: #ffffff;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #000000;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }

    body {
      padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Zaglavlje */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 2px 4px;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 {
      font-size: 25px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .cooker-badge {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: var(--ember-dim);
      border: 1px solid rgba(249, 115, 22, 0.5);
      box-shadow: 0 0 12px var(--ember-glow);
      display: grid;
      place-items: center;
      color: var(--ember);
    }

    .tara-pill {
      padding: 6px 13px;
      border-radius: 999px;
      background: rgba(14, 24, 32, 0.9);
      border: 1px solid var(--cyan);
      box-shadow: 0 0 14px var(--cyan-dim), inset 0 0 8px var(--cyan-dim);
      font-size: 13px;
      font-weight: 700;
      color: #e2f8ff;
      font-variant-numeric: tabular-nums;
    }

    /* Glavna staklena HUD kartica */
    .hud-card {
      background: linear-gradient(180deg, rgba(20, 29, 37, 0.88) 0%, rgba(10, 14, 18, 0.94) 100%);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 0 24px rgba(34, 211, 238, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .rice-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    /* Kružni brojčanik */
    .dial-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
    }

    .dial-wrap svg {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
    }

    .dial-center {
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .dial-center strong {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
    }

    .dial-center span {
      font-size: 12px;
      color: var(--muted);
      margin-left: 1px;
    }

    /* Kontrola gramaže */
    .rice-controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-caption {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .gram-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .gram-value-box {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .gram-input {
      width: 84px;
      background: transparent;
      border: none;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.22);
      color: #ffffff;
      font-size: 32px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      outline: none;
      padding: 0;
    }

    .gram-input:focus {
      border-bottom-color: var(--cyan);
    }

    .gram-unit {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
    }

    .pm-group {
      display: flex;
      gap: 8px;
    }

    .pm-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(15, 23, 30, 0.95);
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.1s ease, box-shadow 0.15s ease;
    }

    .pm-btn.plus {
      border: 1px solid rgba(249, 115, 22, 0.65);
      color: var(--ember);
      box-shadow: 0 0 10px var(--ember-dim);
    }

    .pm-btn.minus {
      border: 1px solid rgba(34, 211, 238, 0.65);
      color: var(--cyan);
      box-shadow: 0 0 10px var(--cyan-dim);
    }

    .pm-btn:active {
      transform: scale(0.93);
    }

    /* Tekstura */
    .texture-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 12px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(7, 11, 15, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }

    .tex-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      padding: 7px 6px;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .tex-btn.active {
      background: var(--cyan);
      color: #031318;
      box-shadow: 0 0 14px var(--cyan-glow);
    }

    /* Ručni unos omjera */
    .ratio-row {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(148, 163, 184, 0.14);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .ratio-label {
      font-size: 14px;
      color: #cbd5e1;
      font-weight: 500;
    }

    .ratio-input-box {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 10px;
      background: rgba(8, 16, 22, 0.95);
      border: 1px solid var(--cyan);
      box-shadow: 0 0 12px var(--cyan-dim);
    }

    .ratio-prefix {
      font-size: 15px;
      font-weight: 700;
      color: var(--cyan);
    }

    .ratio-input {
      width: 52px;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-align: center;
      outline: none;
    }

    /* Dodatne opcije (+20% vode i Switch za opranu rižu) */
    .options-group {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(148, 163, 184, 0.14);
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .boost-row {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }

    .boost-check {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 1.5px solid var(--cyan);
      background: rgba(8, 16, 22, 0.9);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: 0.15s ease;
    }

    .boost-check svg {
      opacity: 0;
      transform: scale(0.7);
      transition: 0.15s ease;
    }

    input[type="checkbox"]:checked + .boost-check {
      background: rgba(34, 211, 238, 0.2);
      box-shadow: 0 0 10px var(--cyan-dim);
    }

    input[type="checkbox"]:checked + .boost-check svg {
      opacity: 1;
      transform: scale(1);
    }

    .boost-text {
      font-size: 13.5px;
      color: #e2e8f0;
      font-weight: 500;
    }

    .boost-preview {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      margin-left: 3px;
    }

    /* Switch za opranu rižu */
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }

    .switch-label {
      font-size: 13.5px;
      color: #e2e8f0;
      font-weight: 500;
    }

    .switch-hint {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      margin-left: 3px;
    }

    .hud-switch {
      position: relative;
      width: 44px;
      height: 24px;
      border-radius: 999px;
      background: rgba(8, 16, 22, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.35);
      flex-shrink: 0;
      transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .hud-switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #94a3b8;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="checkbox"]:checked + .hud-switch {
      background: rgba(34, 211, 238, 0.22);
      border-color: var(--cyan);
      box-shadow: 0 0 12px var(--cyan-dim);
    }

    input[type="checkbox"]:checked + .hud-switch::after {
      transform: translateX(20px);
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan-glow);
    }

    /* Središnja wireframe SVG vaga */
    .scale-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2px 0;
    }

    .scale-svg {
      width: 100%;
      max-width: 280px;
      height: auto;
      filter: drop-shadow(0 0 14px rgba(34, 211, 238, 0.14));
    }

    .total-readout {
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      margin-top: -2px;
      text-align: center;
    }

    .pills-row {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .data-pill {
      padding: 9px 12px;
      border-radius: 999px;
      background: rgba(14, 20, 26, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.28);
      text-align: center;
      font-size: 13.5px;
      font-weight: 700;
      color: #f1f5f9;
      font-variant-numeric: tabular-nums;
    }

    .data-pill.water-active {
      border-color: var(--cyan);
      color: var(--cyan);
      box-shadow: 0 0 14px var(--cyan-dim);
    }

    /* Koraci vaganja */
    .steps-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .step-card {
      padding: 11px 14px;
      border-radius: 12px;
      background: rgba(12, 18, 24, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.28);
      font-size: 15px;
      font-weight: 600;
      color: #f8fafc;
      font-variant-numeric: tabular-nums;
    }

    .step-card.highlight {
      border-color: rgba(249, 115, 22, 0.65);
      background: linear-gradient(90deg, rgba(249, 115, 22, 0.16) 0%, rgba(16, 22, 28, 0.92) 100%);
      color: #ffedd5;
      box-shadow: 0 0 16px rgba(249, 115, 22, 0.14);
    }

    .step-card.highlight strong {
      color: #fb923c;
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="title-wrap">
        <h1>Rice cooker</h1>
        <div class="cooker-badge" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 10h14v7a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3v-7Z"/>
            <path d="M4 10h16"/>
            <path d="M8 7a4 4 0 0 1 8 0"/>
            <circle cx="12" cy="14" r="1.5"/>
          </svg>
        </div>
      </div>
      <div class="tara-pill">Tara: 130 g</div>
    </header>

    <!-- Kontrole unosa -->
    <section class="hud-card">
      <div class="rice-top-row">
        <div class="dial-wrap">
          <svg width="96" height="96" viewBox="0 0 96 96">
            <circle cx="48" cy="48" r="40" fill="none" stroke="rgba(148,163,184,0.16)" stroke-width="6" />
            <circle cx="48" cy="48" r="32" fill="none" stroke="rgba(34,211,238,0.22)" stroke-width="2" stroke-dasharray="2 4" />
            <circle id="dialProgress" cx="48" cy="48" r="40" fill="none" stroke="#22d3ee" stroke-width="6"
                    stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="165" />
          </svg>
          <div class="dial-center">
            <strong id="dialGrams">200</strong><span>g</span>
          </div>
        </div>

        <div class="rice-controls">
          <div class="field-caption">Suha riža</div>
          <div class="gram-row">
            <div class="gram-value-box">
              <input type="number" id="riceInput" class="gram-input" value="200" min="10" max="2000" step="10" inputmode="numeric" />
              <span class="gram-unit">g</span>
            </div>
            <div class="pm-group">
              <button type="button" class="pm-btn minus" id="minusBtn" aria-label="Smanji rižu">−</button>
              <button type="button" class="pm-btn plus" id="plusBtn" aria-label="Povećaj rižu">+</button>
            </div>
          </div>

          <div class="texture-bar">
            <button type="button" class="tex-btn" data-ratio="1.35">Čvršća</button>
            <button type="button" class="tex-btn active" data-ratio="1.50">Standardna</button>
            <button type="button" class="tex-btn" data-ratio="1.65">Mekša</button>
          </div>
        </div>
      </div>

      <div class="ratio-row">
        <label for="ratioInput" class="ratio-label">Omjer (riža : voda)</label>
        <div class="ratio-input-box">
          <span class="ratio-prefix">1 :</span>
          <input type="text" id="ratioInput" class="ratio-input" value="1.50" inputmode="decimal" />
        </div>
      </div>

      <div class="options-group">
        <label class="boost-row">
          <input type="checkbox" id="boostCheck" hidden />
          <span class="boost-check">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </span>
          <span class="boost-text">
            Povećaj vodu 20% <span class="boost-preview" id="boostPreview">(300 g → 360 g)</span>
          </span>
        </label>

        <label class="switch-row">
          <span class="switch-label">
            Oprana riža <span class="switch-hint" id="rinseHint">(−30 g vode)</span>
          </span>
          <input type="checkbox" id="rinseSwitch" hidden />
          <span class="hud-switch" aria-hidden="true"></span>
        </label>
      </div>
    </section>

    <!-- HUD Vaga i razine -->
    <section class="scale-stage">
      <svg class="scale-svg" viewBox="0 0 280 175">
        <defs>
          <radialGradient id="hudGlow" cx="50%" cy="55%" r="48%">
            <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18" />
            <stop offset="100%" stop-color="#000000" stop-opacity="0" />
          </radialGradient>
        </defs>
        <ellipse cx="140" cy="115" rx="125" ry="52" fill="url(#hudGlow)" />
        <ellipse cx="140" cy="122" rx="115" ry="42" fill="none" stroke="rgba(34,211,238,0.22)" stroke-width="1" stroke-dasharray="3 4" />
        <ellipse cx="140" cy="122" rx="96" ry="33" fill="none" stroke="rgba(148,163,184,0.2)" stroke-width="1" />

        <!-- Baza vage -->
        <rect x="64" y="108" width="152" height="44" rx="11" fill="#090e14" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.5" />
        <circle cx="84" cy="130" r="6" fill="none" stroke="#64748b" stroke-width="1.3" />
        <circle cx="196" cy="130" r="6" fill="none" stroke="#64748b" stroke-width="1.3" />
        <rect x="108" y="121" width="64" height="18" rx="4" fill="#03070a" stroke="#22d3ee" stroke-width="1.2" />
        <text id="scaleLcd" x="140" y="134" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="12" font-weight="bold">630 g</text>

        <!-- Posuda kuhala -->
        <path d="M84 30 L196 30 L187 96 C185 104 178 108 170 108 L110 108 C102 108 95 104 93 96 Z"
              fill="rgba(15, 23, 32, 0.85)" stroke="#94a3b8" stroke-width="1.8" />

        <!-- Voda u posudi -->
        <rect id="potWater" x="91" y="58" width="98" height="48" rx="5" fill="rgba(34, 211, 238, 0.28)" stroke="#22d3ee" stroke-width="1" />
        <!-- Riža u posudi -->
        <rect id="potRice" x="93" y="80" width="94" height="26" rx="4" fill="rgba(226, 232, 240, 0.72)" />

        <!-- Gornji rub posude -->
        <ellipse cx="140" cy="30" rx="58" ry="8" fill="#0b1016" stroke="#cbd5e1" stroke-width="1.8" />
        <ellipse cx="140" cy="30" rx="51" ry="5.5" fill="none" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="1" />
      </svg>

      <div class="total-readout" id="totalReadout">Ukupno: 630 g</div>

      <div class="pills-row">
        <div class="data-pill" id="ricePill">Riža: 200 g</div>
        <div class="data-pill" id="waterPill">Voda: 300 g</div>
      </div>
    </section>

    <!-- 3 koraka vaganja -->
    <section class="steps-list">
      <div class="step-card">1. Prazna posuda: <strong>130 g</strong></div>
      <div class="step-card">2. Dodaj rižu do <strong id="stepRice">330 g</strong></div>
      <div class="step-card highlight">3. Dodaj vodu do <strong id="stepTotal">630 g</strong></div>
    </section>
  </main>

  <script>
    const TARE = 130;
    const riceInput = document.getElementById("riceInput");
    const ratioInput = document.getElementById("ratioInput");
    const boostCheck = document.getElementById("boostCheck");
    const rinseSwitch = document.getElementById("rinseSwitch");
    const texButtons = document.querySelectorAll(".tex-btn");

    try {
      const saved = JSON.parse(localStorage.getItem("rc_prefs") || "{}");
      if (saved.rice) riceInput.value = saved.rice;
      if (saved.ratio) ratioInput.value = Number(saved.ratio).toFixed(2);
      if (typeof saved.boost === "boolean") boostCheck.checked = saved.boost;
      if (typeof saved.rinsed === "boolean") rinseSwitch.checked = saved.rinsed;
    } catch (_) {}

    function parseRatio() {
      const raw = String(ratioInput.value).replace(",", ".").trim();
      const val = parseFloat(raw);
      return (!isNaN(val) && val > 0 && val <= 10) ? val : 1.50;
    }

    function syncTextureHighlight(ratio) {
      texButtons.forEach(btn => {
        const preset = parseFloat(btn.dataset.ratio);
        btn.classList.toggle("active", Math.abs(preset - ratio) < 0.005);
      });
    }

    function calculate() {
      let rice = parseInt(riceInput.value, 10);
      if (isNaN(rice) || rice < 1) rice = 10;
      if (rice > 2000) rice = 2000;

      const ratio = parseRatio();
      syncTextureHighlight(ratio);

      const baseWater = Math.round(rice * ratio);
      const boostedWater = Math.round(baseWater * 1.20);
      const isBoosted = boostCheck.checked;
      const isRinsed = rinseSwitch.checked;

      const rinseDeduction = Math.round(rice * 0.15);
      const targetWater = isBoosted ? boostedWater : baseWater;
      const water = Math.max(10, isRinsed ? (targetWater - rinseDeduction) : targetWater);

      const afterRice = TARE + rice;
      const total = afterRice + water;

      document.getElementById("dialGrams").textContent = rice;
      document.getElementById("boostPreview").textContent = `(${baseWater} g → ${boostedWater} g)`;
      document.getElementById("rinseHint").textContent = `(−${rinseDeduction} g vode)`;
      document.getElementById("totalReadout").textContent = `Ukupno: ${total} g`;
      document.getElementById("scaleLcd").textContent = `${total} g`;
      document.getElementById("ricePill").textContent = `Riža: ${rice} g`;

      const waterPill = document.getElementById("waterPill");
      const tags = [];
      if (isBoosted) tags.push("+20%");
      if (isRinsed) tags.push(`−${rinseDeduction} g`);
      waterPill.textContent = tags.length > 0 ? `Voda: ${water} g (${tags.join(", ")})` : `Voda: ${water} g`;
      waterPill.classList.toggle("water-active", isBoosted || isRinsed);

      document.getElementById("stepRice").textContent = `${afterRice} g`;
      document.getElementById("stepTotal").textContent = `${total} g`;

      const circumference = 251.3;
      const pct = Math.min(1, Math.max(0.06, rice / 600));
      document.getElementById("dialProgress").style.strokeDashoffset = (circumference * (1 - pct)).toFixed(1);

      const fillFactor = Math.min(1, Math.max(0.22, rice / 500));
      const riceH = Math.round(16 + fillFactor * 22);
      const waterH = Math.min(68, Math.max(riceH + 8, Math.round(riceH + 14 + (ratio - 1.2) * 18 + (isBoosted ? 6 : 0) - (isRinsed ? 4 : 0))));
      const bottomY = 106;

      const potRice = document.getElementById("potRice");
      const potWater = document.getElementById("potWater");
      potRice.setAttribute("y", bottomY - riceH);
      potRice.setAttribute("height", riceH);
      potWater.setAttribute("y", bottomY - waterH);
      potWater.setAttribute("height", waterH);

      try {
        localStorage.setItem("rc_prefs", JSON.stringify({
          rice,
          ratio,
          boost: isBoosted,
          rinsed: isRinsed
        }));
      } catch (_) {}
    }

    document.getElementById("minusBtn").addEventListener("click", () => {
      const current = parseInt(riceInput.value, 10) || 200;
      riceInput.value = Math.max(10, current - 10);
      calculate();
    });

    document.getElementById("plusBtn").addEventListener("click", () => {
      const current = parseInt(riceInput.value, 10) || 200;
      riceInput.value = Math.min(2000, current + 10);
      calculate();
    });

    riceInput.addEventListener("input", calculate);
    ratioInput.addEventListener("input", calculate);
    ratioInput.addEventListener("blur", () => {
      ratioInput.value = parseRatio().toFixed(2);
      calculate();
    });
    boostCheck.addEventListener("change", calculate);
    rinseSwitch.addEventListener("change", calculate);

    texButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        ratioInput.value = parseFloat(btn.dataset.ratio).toFixed(2);
        calculate();
      });
    });

    calculate();
  </script>
</body>
</html>
