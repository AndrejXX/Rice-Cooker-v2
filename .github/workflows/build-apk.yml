name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi kod repozitorija
        uses: actions/checkout@v4

      - name: Postavi Javu 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Postavi Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Instaliraj Pillow za generiranje ikona
        run: pip install --quiet pillow

      - name: Generiraj nativni Android projekt i monochrome ikonu
        run: |
          python3 - << 'PY'
          import glob, os, shutil, textwrap
          from PIL import Image, ImageDraw

          os.makedirs("app/src/main/java/hr/ricecooker/kalkulator", exist_ok=True)
          os.makedirs("app/src/main/assets", exist_ok=True)
          os.makedirs("app/src/main/res/drawable", exist_ok=True)
          os.makedirs("app/src/main/res/values", exist_ok=True)
          os.makedirs("app/src/main/res/mipmap-anydpi-v26", exist_ok=True)

          candidates = [f for f in (glob.glob("*") + glob.glob("www/*")) if os.path.isfile(f) and "html" in f.lower()]
          if not candidates:
              raise RuntimeError("GRESKA: Nije pronadena HTML datoteka u repozitoriju!")
          shutil.copyfile(candidates[0], "app/src/main/assets/index.html")
          if os.path.getsize("app/src/main/assets/index.html") < 500:
              raise RuntimeError("GRESKA: HTML datoteka je prazna!")

          def render_icon(size, round_mask=False):
              S = 512
              img = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)

              bg = (0, 0, 0, 255)
              fg = (255, 255, 255, 255)
              if round_mask:
                  draw.ellipse([0, 0, S, S], fill=bg)
              else:
                  draw.rounded_rectangle([0, 0, S, S], radius=112, fill=bg)

              # Minimalisticka bijela silueta kuhala
              draw.rounded_rectangle([210, 128, 302, 152], radius=10, fill=fg)
              draw.pieslice([146, 156, 366, 266], start=180, end=360, fill=fg)
              draw.rounded_rectangle([112, 236, 138, 274], radius=7, fill=fg)
              draw.rounded_rectangle([374, 236, 400, 274], radius=7, fill=fg)
              draw.rounded_rectangle([152, 226, 360, 368], radius=42, fill=fg)
              draw.ellipse([224, 266, 288, 330], fill=bg)
              draw.ellipse([242, 284, 270, 312], fill=fg)

              return img.resize((size, size), Image.Resampling.LANCZOS)

          densities = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, px in densities.items():
              out_dir = f"app/src/main/res/{folder}"
              os.makedirs(out_dir, exist_ok=True)
              render_icon(px, round_mask=False).save(f"{out_dir}/ic_launcher.png")
              render_icon(px, round_mask=True).save(f"{out_dir}/ic_launcher_round.png")

          glyph_vector = textwrap.dedent("""\
              <?xml version="1.0" encoding="utf-8"?>
              <vector xmlns:android="http://schemas.android.com/apk/res/android"
                  android:width="108dp"
                  android:height="108dp"
                  android:viewportWidth="108"
                  android:viewportHeight="108">
                  <!-- Gornja rucka poklopca -->
                  <path
                      android:fillColor="#FFFFFF"
                      android:pathData="M46.5,29.5 H61.5 C62.9,29.5 64,30.6 64,32 V34.2 H44 V32 C44,30.6 45.1,29.5 46.5,29.5 Z"/>
                  <!-- Kupola poklopca -->
                  <path
                      android:fillColor="#FFFFFF"
                      android:pathData="M32,46.5 C32,39.2 41,35.5 54,35.5 C67,35.5 76,39.2 76,46.5 Z"/>
                  <!-- Bocne rucke -->
                  <path
                      android:fillColor="#FFFFFF"
                      android:pathData="M26.5,51.5 H31 V58.5 H26.5 C25.4,58.5 24.5,57.6 24.5,56.5 V53.5 C24.5,52.4 25.4,51.5 26.5,51.5 Z M77,51.5 H81.5 C82.6,51.5 83.5,52.4 83.5,53.5 V56.5 C83.5,57.6 82.6,58.5 81.5,58.5 H77 V51.5 Z"/>
                  <!-- Tijelo kuhala s izrezom tipke u sredini -->
                  <path
                      android:fillColor="#FFFFFF"
                      android:fillType="evenOdd"
                      android:pathData="M33,49.5 H75 V68 C75,73 71,77 66,77 H42 C37,77 33,73 33,68 Z M54,56.5 A6.5,6.5 0 1,0 54,69.5 A6.5,6.5 0 1,0 54,56.5 Z M54,60.2 A2.8,2.8 0 1,1 54,65.8 A2.8,2.8 0 1,1 54,60.2 Z"/>
              </vector>
          """)

          files = {
              "settings.gradle": textwrap.dedent("""\
                  pluginManagement {
                      repositories {
                          google()
                          mavenCentral()
                          gradlePluginPortal()
                      }
                  }
                  dependencyResolutionManagement {
                      repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                      repositories {
                          google()
                          mavenCentral()
                      }
                  }
                  rootProject.name = "RiceCooker"
                  include(":app")
              """),
              "build.gradle": textwrap.dedent("""\
                  plugins {
                      id 'com.android.application' version '8.5.2' apply false
                  }
              """),
              "gradle.properties": textwrap.dedent("""\
                  org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
                  android.useAndroidX=true
              """),
              "app/build.gradle": textwrap.dedent("""\
                  plugins {
                      id 'com.android.application'
                  }

                  android {
                      namespace 'hr.ricecooker.kalkulator'
                      compileSdk 34

                      defaultConfig {
                          applicationId "hr.ricecooker.kalkulator"
                          minSdk 24
                          targetSdk 34
                          versionCode 3
                          versionName "1.2"
                      }

                      compileOptions {
                          sourceCompatibility JavaVersion.VERSION_17
                          targetCompatibility JavaVersion.VERSION_17
                      }
                  }
              """),
              "app/src/main/res/values/ic_launcher_background.xml": textwrap.dedent("""\
                  <?xml version="1.0" encoding="utf-8"?>
                  <resources>
                      <color name="ic_launcher_background">#000000</color>
                  </resources>
              """),
              "app/src/main/res/drawable/ic_launcher_foreground.xml": glyph_vector,
              "app/src/main/res/drawable/ic_launcher_monochrome.xml": glyph_vector,
              "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml": textwrap.dedent("""\
                  <?xml version="1.0" encoding="utf-8"?>
                  <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
                      <background android:drawable="@color/ic_launcher_background"/>
                      <foreground android:drawable="@drawable/ic_launcher_foreground"/>
                      <monochrome android:drawable="@drawable/ic_launcher_monochrome"/>
                  </adaptive-icon>
              """),
              "app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml": textwrap.dedent("""\
                  <?xml version="1.0" encoding="utf-8"?>
                  <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
                      <background android:drawable="@color/ic_launcher_background"/>
                      <foreground android:drawable="@drawable/ic_launcher_foreground"/>
                      <monochrome android:drawable="@drawable/ic_launcher_monochrome"/>
                  </adaptive-icon>
              """),
              "app/src/main/AndroidManifest.xml": textwrap.dedent("""\
                  <?xml version="1.0" encoding="utf-8"?>
                  <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                      <application
                          android:label="Rice cooker"
                          android:icon="@mipmap/ic_launcher"
                          android:roundIcon="@mipmap/ic_launcher_round"
                          android:hardwareAccelerated="true"
                          android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                          <activity
                              android:name=".MainActivity"
                              android:exported="true"
                              android:screenOrientation="portrait"
                              android:configChanges="orientation|screenSize|keyboardHidden">
                              <intent-filter>
                                  <action android:name="android.intent.action.MAIN" />
                                  <category android:name="android.intent.category.LAUNCHER" />
                              </intent-filter>
                          </activity>
                      </application>
                  </manifest>
              """),
              "app/src/main/java/hr/ricecooker/kalkulator/MainActivity.java": textwrap.dedent("""\
                  package hr.ricecooker.kalkulator;

                  import android.app.Activity;
                  import android.graphics.Color;
                  import android.os.Bundle;
                  import android.view.ViewGroup;
                  import android.view.Window;
                  import android.view.WindowManager;
                  import android.webkit.WebChromeClient;
                  import android.webkit.WebSettings;
                  import android.webkit.WebView;
                  import android.webkit.WebViewClient;
                  import android.widget.FrameLayout;
                  import java.io.ByteArrayOutputStream;
                  import java.io.InputStream;
                  import java.nio.charset.StandardCharsets;

                  public class MainActivity extends Activity {
                      private WebView webView;

                      @Override
                      protected void onCreate(Bundle savedInstanceState) {
                          super.onCreate(savedInstanceState);

                          Window window = getWindow();
                          window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                          window.setStatusBarColor(Color.BLACK);
                          window.setNavigationBarColor(Color.BLACK);

                          FrameLayout root = new FrameLayout(this);
                          root.setBackgroundColor(Color.BLACK);
                          root.setLayoutParams(new ViewGroup.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT));

                          webView = new WebView(this);
                          webView.setBackgroundColor(Color.BLACK);
                          webView.setLayoutParams(new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT));

                          WebSettings settings = webView.getSettings();
                          settings.setJavaScriptEnabled(true);
                          settings.setDomStorageEnabled(true);
                          settings.setUseWideViewPort(true);
                          settings.setLoadWithOverviewMode(true);

                          webView.setWebViewClient(new WebViewClient());
                          webView.setWebChromeClient(new WebChromeClient());

                          root.addView(webView);
                          setContentView(root);

                          try {
                              InputStream is = getAssets().open("index.html");
                              ByteArrayOutputStream buffer = new ByteArrayOutputStream();
                              byte[] data = new byte[4096];
                              int nRead;
                              while ((nRead = is.read(data, 0, data.length)) != -1) {
                                  buffer.write(data, 0, nRead);
                              }
                              is.close();
                              String html = new String(buffer.toByteArray(), StandardCharsets.UTF_8);
                              webView.loadDataWithBaseURL("https://ricecooker.local/", html, "text/html", "UTF-8", null);
                          } catch (Exception e) {
                              String errHtml = "<html><body style='background:#000;color:#fff;font-family:sans-serif;padding:24px;'>"
                                      + "<h3>Greska pri ucitavanju:</h3><pre>" + e.toString() + "</pre></body></html>";
                              webView.loadData(errHtml, "text/html", "UTF-8");
                          }
                      }

                      @Override
                      public void onBackPressed() {
                          if (webView != null && webView.canGoBack()) {
                              webView.goBack();
                          } else {
                              super.onBackPressed();
                          }
                      }
                  }
              """)
          }

          for path, content in files.items():
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          PY

      - name: Kompajliraj Debug APK
        run: gradle assembleDebug

      - name: Provjeri sadrzaj APK-a
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "classes.dex"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "assets/index.html"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "ic_launcher"

      - name: Spremi APK za preuzimanje
        uses: actions/upload-artifact@v4
        with:
          name: Rice-Cooker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
