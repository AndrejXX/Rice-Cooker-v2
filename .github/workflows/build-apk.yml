name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi kod repozitorija
        uses: actions/checkout@v4

      - name: Postavi Javu 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Postavi Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Instaliraj Pillow za generiranje ikona
        run: pip install --quiet pillow

      - name: Generiraj nativni Android projekt i ikonu bez okvira
        run: |
          python3 - << 'PY'
          import glob, os, shutil, textwrap
          from PIL import Image, ImageDraw

          os.makedirs("app/src/main/java/hr/ricecooker/kalkulator", exist_ok=True)
          os.makedirs("app/src/main/assets", exist_ok=True)
          os.makedirs("app/src/main/res/drawable", exist_ok=True)
          os.makedirs("app/src/main/res/values", exist_ok=True)
          os.makedirs("app/src/main/res/mipmap-anydpi-v26", exist_ok=True)

          candidates = [f for f in (glob.glob("*") + glob.glob("www/*")) if os.path.isfile(f) and "html" in f.lower()]
          if not candidates:
              raise RuntimeError("GRESKA: Nije pronadena HTML datoteka u repozitoriju!")
          shutil.copyfile(candidates[0], "app/src/main/assets/index.html")
          if os.path.getsize("app/src/main/assets/index.html") < 500:
              raise RuntimeError("GRESKA: HTML datoteka je prazna!")

          def render_frameless_icon(size):
              S = 512
              # Potpuno prozirna pozadina bez ikakvog okvira
              img = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)

              fg = (255, 255, 255, 255)
              cut = (0, 0, 0, 0)

              # Gornja rucka poklopca
              draw.rounded_rectangle([206, 108, 306, 136], radius=12, fill=fg)
              # Kupola poklopca
              draw.pieslice([132, 140, 380, 266], start=180, end=360, fill=fg)
              # Bocne rucke
              draw.rounded_rectangle([94, 232, 124, 276], radius=8, fill=fg)
              draw.rounded_rectangle([388, 232, 418, 276], radius=8, fill=fg)
              # Tijelo kuhala
              draw.rounded_rectangle([138, 222, 374, 386], radius=46, fill=fg)
              # Prozirni izrez tipke u sredini
              draw.ellipse([218, 268, 294, 344], fill=cut)
              draw.ellipse([238, 288, 274, 324], fill=fg)

              return img.resize((size, size), Image.Resampling.LANCZOS)

          densities = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, px in densities.items():
              out_dir = f"app/src/main/res/{folder}"
              os.makedirs(out_dir, exist_ok=True)
              icon = render_frameless_icon(px)
              icon.save(f"{out_dir}/ic_launcher.png")
              icon.save(f"{out_dir}/ic_launcher_round.png")

          glyph_vector = textwrap.dedent("""\
              <?xml version="1.0" encoding="utf-8"?>
              <vector xmlns:android="http://schemas.android.com/apk/res/android"
                  android:width="108dp"
                  android:height="108dp"
                  android:viewportWidth="108"
                  android:viewportHeight="108">
                  <path
                      android:fillColor="#FFFFFF"
                      android:pathData="M45.5,27 H62.5 C64,27 65.2,28.2 65.2,29.7 V32.2 H42.8 V29.7 C42.8,28.2 44,27 45.5,27 Z"/>
                  <path
                      android:fillColor="#FFFFFF"
                      android:pathData="M30,45.5 C30,37.4 40,33.5 54,33.5 C68,33.5 78,37.4 78,45.5 Z"/>
                  <path
                      android:fillColor="#FFFFFF"
                      android:pathData="M24,51 H29 V59 H24 C22.8,59 21.8,58 21.8,56.8 V53.2 C21.8,52 22.8,51 24,51 Z M79,51 H84 C85.2,51 86.2,52 86.2,53.2 V56.8 C86.2,58 85.2,59 84,59 H79 V51 Z"/>
                  <path
                      android:fillColor="#FFFFFF"
                      android:fillType="evenOdd"
                      android:pathData="M31,49 H77 V69.5 C77,75 72.5,79.5 67,79.5 H41 C35.5,79.5 31,75 31,69.5 Z M54,56.5 A7.5,7.5 0 1,0 54,71.5 A7.5,7.5 0 1,0 54,56.5 Z M54,60.8 A3.2,3.2 0 1,1 54,67.2 A3.2,3.2 0 1,1 54,60.8 Z"/>
              </vector>
          """)

          files = {
              "settings.gradle": textwrap.dedent("""\
                  pluginManagement {
                      repositories {
                          google()
                          mavenCentral()
                          gradlePluginPortal()
                      }
                  }
                  dependencyResolutionManagement {
                      repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                      repositories {
                          google()
                          mavenCentral()
                      }
                  }
                  rootProject.name = "RiceCooker"
                  include(":app")
              """),
              "build.gradle": textwrap.dedent("""\
                  plugins {
                      id 'com.android.application' version '8.5.2' apply false
                  }
              """),
              "gradle.properties": textwrap.dedent("""\
                  org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
                  android.useAndroidX=true
              """),
              "app/build.gradle": textwrap.dedent("""\
                  plugins {
                      id 'com.android.application'
                  }

                  android {
                      namespace 'hr.ricecooker.kalkulator'
                      compileSdk 34

                      defaultConfig {
                          applicationId "hr.ricecooker.kalkulator"
                          minSdk 24
                          targetSdk 34
                          versionCode 4
                          versionName "1.3"
                      }

                      compileOptions {
                          sourceCompatibility JavaVersion.VERSION_17
                          targetCompatibility JavaVersion.VERSION_17
                      }
                  }
              """),
              "app/src/main/res/values/ic_launcher_background.xml": textwrap.dedent("""\
                  <?xml version="1.0" encoding="utf-8"?>
                  <resources>
                      <color name="ic_launcher_background">#00000000</color>
                  </resources>
              """),
              "app/src/main/res/drawable/ic_launcher_foreground.xml": glyph_vector,
              "app/src/main/res/drawable/ic_launcher_monochrome.xml": glyph_vector,
              "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml": textwrap.dedent("""\
                  <?xml version="1.0" encoding="utf-8"?>
                  <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
                      <background android:drawable="@color/ic_launcher_background"/>
                      <foreground android:drawable="@drawable/ic_launcher_foreground"/>
                      <monochrome android:drawable="@drawable/ic_launcher_monochrome"/>
                  </adaptive-icon>
              """),
              "app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml": textwrap.dedent("""\
                  <?xml version="1.0" encoding="utf-8"?>
                  <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
                      <background android:drawable="@color/ic_launcher_background"/>
                      <foreground android:drawable="@drawable/ic_launcher_foreground"/>
                      <monochrome android:drawable="@drawable/ic_launcher_monochrome"/>
                  </adaptive-icon>
              """),
              "app/src/main/AndroidManifest.xml": textwrap.dedent("""\
                  <?xml version="1.0" encoding="utf-8"?>
                  <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                      <application
                          android:label="Rice cooker"
                          android:icon="@mipmap/ic_launcher"
                          android:roundIcon="@mipmap/ic_launcher_round"
                          android:hardwareAccelerated="true"
                          android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                          <activity
                              android:name=".MainActivity"
                              android:exported="true"
                              android:screenOrientation="portrait"
                              android:configChanges="orientation|screenSize|keyboardHidden">
                              <intent-filter>
                                  <action android:name="android.intent.action.MAIN" />
                                  <category android:name="android.intent.category.LAUNCHER" />
                              </intent-filter>
                          </activity>
                      </application>
                  </manifest>
              """),
              "app/src/main/java/hr/ricecooker/kalkulator/MainActivity.java": textwrap.dedent("""\
                  package hr.ricecooker.kalkulator;

                  import android.app.Activity;
                  import android.graphics.Color;
                  import android.os.Bundle;
                  import android.view.ViewGroup;
                  import android.view.Window;
                  import android.view.WindowManager;
                  import android.webkit.WebChromeClient;
                  import android.webkit.WebSettings;
                  import android.webkit.WebView;
                  import android.webkit.WebViewClient;
                  import android.widget.FrameLayout;
                  import java.io.ByteArrayOutputStream;
                  import java.io.InputStream;
                  import java.nio.charset.StandardCharsets;

                  public class MainActivity extends Activity {
                      private WebView webView;

                      @Override
                      protected void onCreate(Bundle savedInstanceState) {
                          super.onCreate(savedInstanceState);

                          Window window = getWindow();
                          window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                          window.setStatusBarColor(Color.parseColor("#05070A"));
                          window.setNavigationBarColor(Color.parseColor("#05070A"));

                          FrameLayout root = new FrameLayout(this);
                          root.setBackgroundColor(Color.parseColor("#05070A"));
                          root.setLayoutParams(new ViewGroup.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT));

                          webView = new WebView(this);
                          webView.setBackgroundColor(Color.parseColor("#05070A"));
                          webView.setLayoutParams(new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT));

                          WebSettings settings = webView.getSettings();
                          settings.setJavaScriptEnabled(true);
                          settings.setDomStorageEnabled(true);
                          settings.setUseWideViewPort(true);
                          settings.setLoadWithOverviewMode(true);

                          webView.setWebViewClient(new WebViewClient());
                          webView.setWebChromeClient(new WebChromeClient());

                          root.addView(webView);
                          setContentView(root);

                          try {
                              InputStream is = getAssets().open("index.html");
                              ByteArrayOutputStream buffer = new ByteArrayOutputStream();
                              byte[] data = new byte[4096];
                              int nRead;
                              while ((nRead = is.read(data, 0, data.length)) != -1) {
                                  buffer.write(data, 0, nRead);
                              }
                              is.close();
                              String html = new String(buffer.toByteArray(), StandardCharsets.UTF_8);
                              webView.loadDataWithBaseURL("https://ricecooker.local/", html, "text/html", "UTF-8", null);
                          } catch (Exception e) {
                              String errHtml = "<html><body style='background:#05070a;color:#fff;font-family:sans-serif;padding:24px;'>"
                                      + "<h3>Greska pri ucitavanju:</h3><pre>" + e.toString() + "</pre></body></html>";
                              webView.loadData(errHtml, "text/html", "UTF-8");
                          }
                      }

                      @Override
                      public void onBackPressed() {
                          if (webView != null && webView.canGoBack()) {
                              webView.goBack();
                          } else {
                              super.onBackPressed();
                          }
                      }
                  }
              """)
          }

          for path, content in files.items():
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          PY

      - name: Kompajliraj Debug APK
        run: gradle assembleDebug

      - name: Provjeri sadrzaj APK-a
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "classes.dex"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "assets/index.html"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "ic_launcher"

      - name: Spremi APK za preuzimanje
        uses: actions/upload-artifact@v4
        with:
          name: Rice-Cooker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
